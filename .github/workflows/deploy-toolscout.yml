name: Deploy ToolScout to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "toolscout/**"
      - ".github/workflows/deploy-toolscout.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate site files
        run: |
          test -s toolscout/index.html
          test -s toolscout/he/index.html
          test -s toolscout/assets/site.js
          test -s toolscout/assets/style.css
          grep -q 'lang="he" dir="rtl"' toolscout/he/index.html
          echo "ToolScout files validated."
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./toolscout
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
