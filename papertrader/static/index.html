<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>Paper Trader</title>
<style>
:root{--bg:#0b0e14;--card:#141923;--card2:#1b2230;--tx:#e8ecf3;--mut:#8a94a8;--g:#22c55e;--r:#ef4444;--b:#3b82f6;--y:#f5b942}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Arial;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
.pos{color:var(--g)}.neg{color:var(--r)}.mut{color:var(--mut)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 14px 8px;border-bottom:1px solid #222a3a}
.demo{font-size:11px;color:var(--y);letter-spacing:.5px}
.top{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;margin-top:4px}
.top .k{font-size:11px;color:var(--mut)}.top .v{font-size:20px;font-weight:700}.top .s .v{font-size:16px}
#banner{display:none;margin:8px 14px;padding:8px 10px;border-radius:8px;background:#3a2a10;color:var(--y);font-size:13px}
#banner.mock{background:#3a1010;color:#ff9b9b}
.chartbox{margin:8px 10px;background:#131722;border:1px solid #1e222d;border-radius:10px;padding:6px 6px 2px;direction:ltr}
.chartbox .bar{direction:rtl}
#wrap{position:relative}
#legend{position:absolute;top:6px;left:8px;z-index:3;font:12px/1.5 -apple-system,Segoe UI,Arial;color:#d1d4dc;pointer-events:none;direction:ltr;text-shadow:0 0 4px #131722}
#legend b{font-size:13px}#legend .u{color:#26a69a}#legend .d{color:#ef5350}
#legend .mt{color:#787b86}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
select,input{background:var(--card2);color:var(--tx);border:1px solid #2a3347;border-radius:8px;padding:8px;font-size:15px;width:100%}
.bar select{width:auto;flex:1;min-width:0;padding:6px 8px;font-size:14px}
#chart{height:min(52vh,430px);min-height:320px}
.tf{display:flex;white-space:nowrap;width:100%;justify-content:space-between;direction:ltr;order:3}.bar{align-items:center}.tf button{background:transparent;color:#787b86;border:0;border-radius:4px;padding:6px 9px;margin-inline-end:2px;font-weight:600}
.tf button.on{background:#2a2e39;color:#fff}
.bar select{background:#1e222d;border-color:#2a2e39}
section{display:none;padding:0 14px 70px}section.on{display:block}
.card{background:var(--card);border-radius:12px;padding:12px;margin:10px 0}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px}
.LONG{background:#12331f;color:var(--g)}.SHORT{background:#3a1515;color:var(--r)}
.lv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0;font-size:12px}
.lv div{background:var(--card2);border-radius:8px;padding:6px;text-align:center}.lv b{display:block;font-size:13px;direction:ltr}
button.act{background:var(--b);color:#fff;border:0;border-radius:10px;padding:11px;font-weight:700;font-size:15px;width:100%;margin-top:6px}
button.sec{background:var(--card2);color:var(--tx)}button.danger{background:#7f1d1d}
details{margin-top:6px;font-size:13px;color:var(--mut)}details p{margin:4px 0}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:#10141d;border-top:1px solid #222a3a;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:12px 4px;font-size:13px}
nav button.on{color:#fff;border-top:2px solid var(--b)}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:20}.modal.on{display:flex}
.sheet{background:var(--card);width:100%;border-radius:16px 16px 0 0;padding:16px;max-height:90vh;overflow:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{font-size:12px;color:var(--mut);display:block;margin:6px 0 2px}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:10px;border-radius:8px;border:1px solid #2a3347;background:var(--card2);color:var(--tx)}
.seg button.on.long{background:#12331f;border-color:var(--g)}.seg button.on.short{background:#3a1515;border-color:var(--r)}.seg button.on.neu{border-color:var(--b);background:#14264a}
#err{color:#ff8a8a;font-size:13px;min-height:18px;margin-top:6px}
.fab{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));inset-inline-start:14px;background:var(--b);color:#fff;border:0;border-radius:28px;padding:12px 18px;font-weight:700;z-index:6;box-shadow:0 4px 14px #0008}
</style>
</head>
<body>
<header>
  <div class="demo">● מסחר דמו בלבד – אין כסף אמיתי · עמלת Taker 0.055%</div>
  <div class="top">
    <div><div class="k">יתרת תיק דמו (Equity)</div><div class="v" id="eq">$450.00</div></div>
    <div class="s"><div class="k">PnL פתוח</div><div class="v" id="upnl">$0.00</div></div>
    <div class="s"><div class="k">Win Rate</div><div class="v" id="wr">—</div></div>
  </div>
</header>
<div id="banner"></div>

<div class="chartbox">
  <div class="bar">
    <select id="exSel"></select><select id="symSel"></select>
    <div class="tf" id="tfBar"></div>
  </div>
  <div id="wrap"><div id="legend"></div><div id="chart"></div></div>
</div>

<section id="t-signals" class="on">
  <div class="mut" id="sigMeta" style="margin:6px 0"></div>
  <div id="sigList"></div>
</section>
<section id="t-pos"><div id="posList"></div></section>
<section id="t-hist">
  <div class="card"><div class="row"><b>ביצועים</b><span class="mut" id="hMeta"></span></div><div id="curve" style="height:120px"></div></div>
  <div id="statsBox"></div>
  <div id="histList"></div>
  <button class="act danger" onclick="resetAcc()">איפוס חשבון דמו ל-$450</button>
</section>

<button class="fab" onclick="openTrade()">+ עסקה ידנית</button>
<nav>
  <button class="on" data-t="signals">איתותי AI</button>
  <button data-t="pos">פוזיציות פתוחות <span id="pc"></span></button>
  <button data-t="hist">היסטוריה וביצועים</button>
</nav>

<div class="modal" id="modal" onclick="if(event.target===this)closeM()">
  <div class="sheet">
    <div class="row"><b id="mTitle">עסקת דמו</b><button class="tf" style="background:none;border:0;color:var(--mut);font-size:22px" onclick="closeM()">✕</button></div>
    <div class="grid2">
      <div><label>בורסה</label><select id="fEx"></select></div>
      <div><label>צמד</label><select id="fSym"></select></div>
    </div>
    <label>כיוון</label>
    <div class="seg" id="fSide"><button data-v="LONG" class="long on">LONG</button><button data-v="SHORT" class="short">SHORT</button></div>
    <label>סוג פקודה</label>
    <div class="seg" id="fType"><button data-v="market" class="neu on">Market</button><button data-v="limit" class="neu">Limit</button></div>
    <div id="limBox" style="display:none"><label>מחיר Limit</label><input id="fLim" type="number" step="any" inputmode="decimal"></div>
    <div class="grid2">
      <div><label>סכום (מרג'ין $)</label><input id="fMargin" type="number" step="any" inputmode="decimal"></div>
      <div><label>מינוף (x)</label><input id="fLev" type="number" step="1" inputmode="numeric"></div>
      <div><label>Stop-Loss</label><input id="fSl" type="number" step="any" inputmode="decimal"></div>
      <div><label>Take-Profit 1</label><input id="fTp1" type="number" step="any" inputmode="decimal"></div>
      <div><label>Take-Profit 2 (אופציונלי)</label><input id="fTp2" type="number" step="any" inputmode="decimal"></div>
    </div>
    <div class="mut" id="fInfo" style="font-size:12px;margin-top:6px"></div>
    <div id="err"></div>
    <button class="act" onclick="submitTrade()">היכנס לעסקת דמו</button>
  </div>
</div>

<script src="lw.js"></script>
<script>
const $=id=>document.getElementById(id);
const fmt=(n,d=2)=>n==null?'—':Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const px=n=>n==null?'—':(n>=100?fmt(n,2):n>=1?fmt(n,4):fmt(n,6));
const money=n=>'\u200E'+(n<0?'-':'')+'$'+fmt(Math.abs(n));
const cls=n=>n>0?'pos':n<0?'neg':'';
let CFG,SIGS=[],POS=[],cur={ex:'bybit',sym:'BTC/USDT:USDT',tf:'15m'},lines=[],lastSig=null;

/* chart */
const UP='#26a69a',DN='#ef5350';
const chart=LightweightCharts.createChart($('chart'),{
  layout:{background:{type:'solid',color:'#131722'},textColor:'#b2b5be',fontFamily:'-apple-system,Segoe UI,Arial',fontSize:11},
  grid:{vertLines:{color:'#1e222d'},horzLines:{color:'#1e222d'}},
  crosshair:{mode:LightweightCharts.CrosshairMode.Normal,vertLine:{color:'#787b86',style:3,labelBackgroundColor:'#2a2e39'},horzLine:{color:'#787b86',style:3,labelBackgroundColor:'#2a2e39'}},
  rightPriceScale:{borderColor:'#2a2e39',scaleMargins:{top:.08,bottom:.22}},
  timeScale:{borderColor:'#2a2e39',timeVisible:true,secondsVisible:false,rightOffset:6,barSpacing:7},
  localization:{locale:'he-IL',timeFormatter:t=>new Date(t*1000).toLocaleString('he-IL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})},
  autoSize:true});
let extra=[];
const series=chart.addCandlestickSeries({autoscaleInfoProvider:o=>{const b=o();if(!b||!extra.length)return b;return{priceRange:{minValue:Math.min(b.priceRange.minValue,...extra),maxValue:Math.max(b.priceRange.maxValue,...extra)},margins:b.margins}},upColor:UP,downColor:DN,borderUpColor:UP,borderDownColor:DN,wickUpColor:UP,wickDownColor:DN,
  priceLineVisible:true,lastValueVisible:true});
const vol=chart.addHistogramSeries({priceFormat:{type:'volume'},priceScaleId:'vol',lastValueVisible:false,priceLineVisible:false});
chart.priceScale('vol').applyOptions({scaleMargins:{top:.82,bottom:0}});
const ema20=chart.addLineSeries({color:'#f5b942',lineWidth:1,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
const ema50=chart.addLineSeries({color:'#42a5f5',lineWidth:1,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
function emaCalc(a,n){const o=[],k=2/(n+1);let e=null;a.forEach((x,i)=>{if(i<n-1){o.push(null);return}if(e===null)e=a.slice(0,n).reduce((s,y)=>s+y,0)/n;else e=x*k+e*(1-k);o.push(e)});return o}
let candles=[];
const pf=n=>n==null?'—':(n>=1000?n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):n>=1?n.toFixed(4):n.toFixed(6));
function legend(c,e20,e50){
  if(!c){$('legend').innerHTML='';return}
  const chg=(c.close-c.open)/c.open*100,k=chg>=0?'u':'d';
  $('legend').innerHTML=`<b>${cur.sym.split(':')[0]} · ${cur.tf} · ${cur.ex.toUpperCase()}</b><br>`+
   `<span class="mt">O</span> <span class="${k}">${pf(c.open)}</span> <span class="mt">H</span> <span class="${k}">${pf(c.high)}</span> <span class="mt">L</span> <span class="${k}">${pf(c.low)}</span> <span class="mt">C</span> <span class="${k}">${pf(c.close)}</span> <span class="${k}">${chg>=0?'+':''}${chg.toFixed(2)}%</span><br>`+
   `<span style="color:#f5b942">EMA20 ${e20!=null?pf(e20):'—'}</span> <span style="color:#42a5f5">EMA50 ${e50!=null?pf(e50):'—'}</span>`;
}
function lastLegend(){const n=candles.length-1;if(n<0)return legend(null);const c=candles[n];legend(c,ema20d[n]&&ema20d[n].value,ema50d[n]&&ema50d[n].value)}
let ema20d=[],ema50d=[];
chart.subscribeCrosshairMove(p=>{
  if(!p.time||!p.seriesData.size)return lastLegend();
  const c=p.seriesData.get(series);if(!c)return lastLegend();
  const e=p.seriesData.get(ema20),f=p.seriesData.get(ema50);legend(c,e&&e.value,f&&f.value);
});
async function loadChart(fit){
  try{
    const r=await fetch(`/api/ohlcv?exchange=${cur.ex}&symbol=${encodeURIComponent(cur.sym)}&tf=${cur.tf}`);
    if(!r.ok)throw new Error((await r.json()).detail);
    const d=await r.json();
    candles=d.map(c=>({time:c[0]/1000,open:c[1],high:c[2],low:c[3],close:c[4]}));
    series.setData(candles);
    vol.setData(d.map(c=>({time:c[0]/1000,value:c[5],color:c[4]>=c[1]?'rgba(38,166,154,.45)':'rgba(239,83,80,.45)'})));
    const cl=candles.map(c=>c.close),e1=emaCalc(cl,20),e2=emaCalc(cl,50);
    ema20d=candles.map((c,i)=>e1[i]==null?{time:c.time}:{time:c.time,value:e1[i]});
    ema50d=candles.map((c,i)=>e2[i]==null?{time:c.time}:{time:c.time,value:e2[i]});
    ema20.setData(ema20d);ema50.setData(ema50d);
    if(fit){const n=candles.length;chart.timeScale().setVisibleLogicalRange({from:Math.max(0,n-95),to:n+8})}
    lastLegend();
  }catch(e){setBanner('לא ניתן לטעון נרות: '+e.message)}
  drawLines();
}
const usd=n=>(n<0?'-':'+')+'$'+Math.abs(n).toFixed(2);
function drawLines(){
  lines.forEach(l=>series.removePriceLine(l));lines=[];extra=[];
  const add=(price,color,title,style=2,w=1)=>price&&(extra.push(price),lines.push(series.createPriceLine({price,color,lineWidth:w,lineStyle:style,axisLabelVisible:true,title})));
  POS.filter(p=>p.exchange===cur.ex&&p.symbol===cur.sym).forEach(p=>{
    const d=p.side==='LONG'?1:-1,at=x=>d*(x-p.entry)*p.qty;
    add(p.entry,'#2962ff',`${p.side} ${p.leverage}x  ${p.status==='pending'?'LIMIT':'ENTRY'}`,0,2);
    add(p.sl,'#ef5350','SL '+usd(at(p.sl)));add(p.tp1,'#26a69a','TP1 '+usd(at(p.tp1)));add(p.tp2,'#26a69a','TP2 '+usd(at(p.tp2)));
  });
  if(lastSig&&lastSig.exchange===cur.ex&&lastSig.symbol===cur.sym){
    add(lastSig.entry,'#f5b942',`איתות ${lastSig.side}`,1,2);add(lastSig.sl,'#ff8a80','איתות SL',1);add(lastSig.tp1,'#69f0ae','איתות TP1',1);add(lastSig.tp2,'#b9f6ca','איתות TP2',1);
  }
}
$('tfBar').innerHTML=['1m','5m','15m','1h','4h'].map(t=>`<button data-tf="${t}" class="${t==='15m'?'on':''}">${t}</button>`).join('');
$('tfBar').onclick=e=>{const t=e.target.dataset.tf;if(!t)return;cur.tf=t;[...$('tfBar').children].forEach(b=>b.classList.toggle('on',b.dataset.tf===t));loadChart(true)};

/* tabs */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id==='t-'+b.dataset.t));
  if(b.dataset.t==='hist')loadHist();
});
function setBanner(t,mock){const b=$('banner');b.style.display=t?'block':'none';b.textContent=t||'';b.className=mock?'mock':''}

/* state */
async function refresh(){
  try{
    const s=await (await fetch('/api/state')).json();
    POS=s.positions;const a=s.account;
    $('eq').textContent=money(a.equity);$('eq').className='v '+cls(a.equity-a.start);
    $('upnl').textContent=money(a.upnl);$('upnl').className='v '+cls(a.upnl);
    $('wr').textContent=a.win_rate==null?'—':fmt(a.win_rate,0)+'% ('+a.wins+'/'+a.trades+')';
    $('pc').textContent=POS.length?'('+POS.length+')':'';
    const errs=Object.entries(s.errors||{}).map(([k,v])=>k+': '+v).join(' | ');
    if(s.mock)setBanner('⚠ מצב סימולציה אופליין – המחירים אינם אמיתיים (PT_MOCK=1)',true);
    else setBanner(errs?'בורסה לא זמינה מהשרת: '+errs:'');
    renderPos();drawLines();
  }catch(e){setBanner('אין חיבור לשרת')}
}
function renderPos(){
  $('posList').innerHTML=POS.length?POS.map(p=>`
  <div class="card"><div class="row"><div><span class="tag ${p.side}">${p.side}</span> <b>${p.symbol.split(':')[0]}</b> <span class="mut">${p.exchange} · ${p.leverage}x ${p.status==='pending'?'· ממתין (Limit)':''}</span></div>
  <b class="${cls(p.upnl)}">${p.status==='open'?money(p.upnl):''}</b></div>
  <div class="lv"><div>כניסה<b>${px(p.entry)}</b></div><div>מחיר<b>${px(p.mark)}</b></div><div>SL<b>${px(p.sl)}</b></div><div>TP<b>${px(p.tp1)}${p.tp2?' / '+px(p.tp2):''}</b></div></div>
  <div class="mut" style="font-size:12px">מרג'ין $${fmt(p.margin)} · כמות ${fmt(p.qty,4)} · עמלות $${fmt(p.fees,3)} ${p.tp1_hit?'· TP1 הושג, SL בכניסה':''}</div>
  <button class="act sec" onclick="focusPos(${p.id})">הצג בגרף</button>
  <button class="act danger" onclick="closePos(${p.id})">${p.status==='pending'?'בטל פקודה':'סגור עכשיו (דמו)'}</button></div>`).join(''):'<div class="card mut">אין פוזיציות פתוחות.</div>'
}
function focusPos(id){const p=POS.find(x=>x.id===id);cur.ex=p.exchange;cur.sym=p.symbol;$('exSel').value=p.exchange;$('symSel').value=p.symbol;loadChart(true);window.scrollTo({top:0,behavior:'smooth'})}
async function closePos(id){if(!confirm('לסגור את הפוזיציה במחיר השוק (דמו)?'))return;await fetch('/api/close/'+id,{method:'POST'});refresh()}

/* signals */
async function loadSignals(){
  try{
    const d=await (await fetch('/api/signals')).json();SIGS=d.signals;
    $('sigMeta').textContent=d.updated?`עודכן ${new Date(d.updated*1000).toLocaleTimeString('he-IL')} · ${SIGS.length} איתותים (מתחדש כל 2 דק׳)`:'מחשב איתותים ראשונים…';
    $('sigList').innerHTML=SIGS.length?SIGS.map((s,i)=>`
    <div class="card"><div class="row"><div><span class="tag ${s.side}">${s.side}</span> <b>${s.symbol.split(':')[0]}</b> <span class="mut">${s.exchange}</span></div><span class="mut">ביטחון ${s.confidence}%</span></div>
    ${s.strategy_name?`<div style="margin:6px 0 0;font-size:12px"><span class="tag" style="background:#1b2230;color:#c9d1e0">${s.strategy_name}</span> ${s.experimental?'<span class="tag" style="background:#3a2a10;color:#f5b942">ניסיוני</span>':''} <span class="mut">${s.bt||''}</span></div>`:''}
    <div class="lv"><div>Entry<b>${px(s.entry)}</b></div><div>SL<b>${px(s.sl)}</b></div><div>TP1<b>${px(s.tp1)}</b></div><div>TP2<b>${px(s.tp2)}</b></div></div>
    <div class="mut" style="font-size:12px">סיכון ${fmt(s.risk_pct*100,2)}% ($${fmt(s.risk_usd)}) · מינוף ${s.leverage}x · מרג'ין $${fmt(s.margin)}</div>
    <details><summary>דיון הסוכנים</summary>${s.discussion.map(x=>`<p><b>${x.agent}:</b> ${x.text}</p>`).join('')}</details>
    <button class="act sec" onclick="showSig(${i})">הצג בגרף</button>
    <button class="act" onclick="openTrade(${i})">היכנס לעסקת דמו</button></div>`).join(''):'<div class="card mut">אין כרגע איתות עם יתרון ברור (או שהבורסה לא זמינה).</div>';
  }catch(e){}
}
function showSig(i){lastSig=SIGS[i];cur.ex=lastSig.exchange;cur.sym=lastSig.symbol;$('exSel').value=cur.ex;$('symSel').value=cur.sym;loadChart(true);window.scrollTo({top:0,behavior:'smooth'})}

/* trade form */
let fSide='LONG',fType='market',curStrat='manual';
function seg(id,cb){$(id).onclick=e=>{const v=e.target.dataset.v;if(!v)return;[...$(id).children].forEach(b=>b.classList.toggle('on',b===e.target));cb(v)}}
seg('fSide',v=>fSide=v);seg('fType',v=>{fType=v;$('limBox').style.display=v==='limit'?'block':'none'});
function setSeg(id,v){[...$(id).children].forEach(b=>b.classList.toggle('on',b.dataset.v===v))}
function openTrade(i){
  $('err').textContent='';$('fInfo').textContent='';
  const s=i!=null?SIGS[i]:null;
  $('mTitle').textContent=s?`עסקת דמו – ${s.symbol.split(':')[0]}`:'עסקת דמו ידנית';
  $('fEx').value=s?s.exchange:cur.ex;$('fSym').value=s?s.symbol:cur.sym;
  fSide=s?s.side:'LONG';setSeg('fSide',fSide);fType='market';setSeg('fType','market');$('limBox').style.display='none';
  $('fMargin').value=s?s.margin.toFixed(2):'';$('fLev').value=s?s.leverage:5;
  $('fSl').value=s?+s.sl.toPrecision(7):'';$('fTp1').value=s?+s.tp1.toPrecision(7):'';$('fTp2').value=s&&s.tp2?+s.tp2.toPrecision(7):'';curStrat=s?(s.strategy||'signal'):'manual';
  $('modal').classList.add('on');
}
function closeM(){$('modal').classList.remove('on')}
async function submitTrade(){
  const n=id=>$(id).value===''?null:parseFloat($(id).value);
  const body={exchange:$('fEx').value,symbol:$('fSym').value,side:fSide,margin:n('fMargin'),leverage:n('fLev'),sl:n('fSl'),tp1:n('fTp1'),tp2:n('fTp2'),order_type:fType,limit_price:n('fLim'),source:curStrat};
  const r=await fetch('/api/trade',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){const d=await r.json().catch(()=>({}));$('err').textContent=typeof d.detail==='string'?d.detail:'פרטים לא תקינים';return}
  closeM();await refresh();document.querySelector('nav [data-t=pos]').click();
}

/* history */
async function loadStats(){
  try{
    const r=await fetch('/api/stats');if(!r.ok)return;const d=await r.json();
    $('statsBox').innerHTML=d.stats.length?`<div class="card"><b>ביצועים לפי אסטרטגיה (עסקאות דמו חיות)</b><div class="mut" style="font-size:12px;margin:2px 0 6px">R = רווח ביחס לסיכון בעסקה. מדגם קטן אינו מוכיח כלום – מתחילים להסיק מ-30+ עסקאות.</div>
    ${d.stats.map(s=>`<div class="row" style="padding:5px 0;border-top:1px solid #222a3a"><span>${s.strategy}</span><span class="mut">${s.n} עסקאות · ${s.win_rate==null?'—':s.win_rate.toFixed(0)+'%'} · ${s.avg_r==null?'—':s.avg_r.toFixed(2)+'R'}</span><b class="${cls(s.pnl)}">${money(s.pnl)}</b></div>`).join('')}</div>`:'';
  }catch(e){}
}
async function loadHist(){loadStats();
  const d=await (await fetch('/api/history')).json();
  const t=d.trades.filter(x=>x.status==='closed');
  const tot=t.reduce((s,x)=>s+x.realized,0);
  $('hMeta').textContent=`${t.length} עסקאות · סה״כ ${money(tot)}`;
  $('histList').innerHTML=t.length?t.map(x=>`<div class="card"><div class="row"><div><span class="tag ${x.side}">${x.side}</span> <b>${x.symbol.split(':')[0]}</b> <span class="mut">${x.exchange} · ${x.leverage}x</span></div><b class="${cls(x.realized)}">${money(x.realized)}</b></div>
  <div class="mut" style="font-size:12px">${px(x.entry)} → ${px(x.close_price)} · ${x.close_reason} · עמלות $${fmt(x.fees,3)} · ${new Date(x.closed*1000).toLocaleString('he-IL')}</div></div>`).join(''):'<div class="card mut">עדיין אין עסקאות סגורות.</div>';
  const c=$('curve');c.innerHTML='';
  if(d.curve.length>1){
    const ch=LightweightCharts.createChart(c,{layout:{background:{color:'#141923'},textColor:'#8a94a8'},grid:{vertLines:{visible:false},horzLines:{color:'#1b2230'}},autoSize:true,timeScale:{timeVisible:true}});
    const l=ch.addLineSeries({color:'#3b82f6',lineWidth:2});
    l.setData(d.curve.map(([t,b])=>({time:Math.floor(t),value:b})).filter((p,i,a)=>!i||p.time>a[i-1].time));ch.timeScale().fitContent();
  }else c.innerHTML='<div class="mut" style="padding:40px 0;text-align:center">עקומת הון תופיע אחרי 2 עסקאות סגורות</div>';
}
async function resetAcc(){if(confirm('למחוק את כל ההיסטוריה ולאפס ל-$450?')){await fetch('/api/reset',{method:'POST'});refresh();loadHist()}}

/* init */
(async()=>{
  CFG=await (await fetch('/api/config')).json();
  const exo=CFG.exchanges.map(e=>`<option value="${e}">${e}</option>`).join('');
  const syo=CFG.symbols.map(s=>`<option value="${s}">${s.split(':')[0]}</option>`).join('');
  ['exSel','fEx'].forEach(i=>$(i).innerHTML=exo);['symSel','fSym'].forEach(i=>$(i).innerHTML=syo);
  $('exSel').onchange=e=>{cur.ex=e.target.value;loadChart(true)};$('symSel').onchange=e=>{cur.sym=e.target.value;loadChart(true)};
  await loadChart(true);refresh();loadSignals();
  setInterval(refresh,3000);setInterval(loadSignals,15000);setInterval(()=>loadChart(false),5000);
})();
</script>
</body>
